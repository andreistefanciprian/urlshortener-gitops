apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-clouddns
  namespace: external-dns
spec:
  interval: 5m0s
  releaseName: external-dns-clouddns
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: external-dns
      version: 1.20.0
      sourceRef:
        kind: HelmRepository
        name: external-dns-charts
        namespace: flux-system
  values:
    provider:
      name: google
    google:
      project: ${GCP_PROJECT}
    serviceAccount:
      annotations:
        iam.gke.io/gcp-service-account: "home-external-dns@${GCP_PROJECT}.iam.gserviceaccount.com"
    domainFilters:
      - ${INTERNAL_DOMAIN}
    policy: upsert-only
    sources:
      - ingress
      - gateway-httproute
